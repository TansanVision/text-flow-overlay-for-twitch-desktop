[package]
name = "twitch-text-flow-overlay"
version = "0.1.0"
description = "A desktop app that streams Twitch comments."
authors = ["Tansan Vision"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "twitch_text_flow_overlay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-localhost = "2.3.2"
reqwest = { version = "0.13.3", default-features = false, features = ["form", "json", "rustls"] }
tauri-plugin-opener = "2.5.4"
futures-util = "0.3"
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
tokio = { version = "1", features = ["time"] }
